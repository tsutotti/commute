<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css"><title>通勤快適</title></head>
<body><main class="app">
<header><div class="eyebrow">MY COMMUTE</div><h1>通勤快適</h1><p id="dateLabel"></p></header>
<section class="panel">
<label>出発駅</label><div class="station-grid" id="origin">
<button class="station active" data-value="karasuma-oike">烏丸御池</button>
<button class="station" data-value="kyoto">京都</button><button class="station" data-value="osaka">大阪</button></div>
<div class="swap">⇅</div><label>到着駅</label><div class="station-grid" id="destination">
<button class="station" data-value="karasuma-oike">烏丸御池</button>
<button class="station" data-value="kyoto">京都</button><button class="station active" data-value="osaka">大阪</button></div>
<div class="time-row"><div><label>出発時刻</label><div class="time" id="timeLabel">--:--</div></div>
<button class="secondary" id="changeTime">時刻を変更</button></div>
<button class="search" id="searchBtn">この条件で検索</button>
</section>
<section id="status" class="status"></section><section id="results" class="results"></section>
<footer><span id="dataVersion">時刻表データ: --</span><span>オフライン検索対応</span></footer>
</main><script src="data/timetable.js"></script><script src="app.js"></script></body></html>
